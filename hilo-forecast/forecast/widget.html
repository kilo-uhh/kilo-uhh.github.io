<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilo Bay Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --grid: #e7e6e2; --border: #dcdbd6;
    --series-1: #2a78d6; --series-1-band: rgba(42,120,214,0.16); --series-2: #eb6834;
    --series-3: #1baf7a; --series-3-band: rgba(27,175,122,0.16);
    --obs: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
      --grid: #2e2e2c; --border: #3a3a37;
      --series-1: #3987e5; --series-1-band: rgba(57,135,229,0.22); --series-2: #d95926;
      --series-3: #199e70; --series-3-band: rgba(25,158,112,0.22);
      --obs: #c3c2b7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e87;
    --grid: #2e2e2c; --border: #3a3a37;
    --series-1: #3987e5; --series-1-band: rgba(57,135,229,0.22); --series-2: #d95926;
    --series-3: #199e70; --series-3-band: rgba(25,158,112,0.22);
    --obs: #c3c2b7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text);
         font: 15px/1.5 "Public Sans", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 32px; }
  .eyebrow { font: 500 12px "IBM Plex Mono", monospace; letter-spacing: .06em;
             text-transform: uppercase; color: var(--text-2); margin: 0 0 4px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .meta { color: var(--text-2); font-size: 13px; margin: 0 0 16px; }
  .toggle { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .toggle button { font: 13px "Public Sans", sans-serif; padding: 6px 10px; cursor: pointer;
                   border: 1px solid var(--border); border-radius: 6px;
                   background: transparent; color: var(--text-2); }
  .toggle button[aria-pressed="true"] { color: var(--text); border-color: var(--text-2); font-weight: 600; }
  .chart-wrap { position: relative; height: 340px; }
  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 6px; }
  .note { color: var(--text-2); font-size: 13px; margin: 0 0 10px; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-2); font-weight: 600; }
  td { font-family: "IBM Plex Mono", monospace; }
  .status { font: 12px "IBM Plex Mono", monospace; color: var(--muted); margin-top: 20px; }
  .err { color: var(--text-2); padding: 40px 0; }
  .summary { font-size: 16px; line-height: 1.55; margin: 0 0 16px; max-width: 70ch; }
  .chart-wrap.skill { height: 280px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
  details table { margin-top: 8px; }
  /* Embedded in the lab site (widget.html?embed): the page supplies the heading */
  body.embed { background: transparent; }
  body.embed main { padding: 0; max-width: none; }
  body.embed .eyebrow, body.embed h1 { display: none; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Near-term forecast · PacIOOS wqb_04</p>
  <h1>Hilo Bay water temperature, next 7 days</h1>
  <p class="meta" id="meta">Loading…</p>
  <p class="summary" id="summary"></p>

  <div class="toggle" role="group" aria-label="Forecast model">
    <button data-model="anomaly_ar1" aria-pressed="true">Anomaly model (tested)</button>
    <button data-model="anomaly_slow" aria-pressed="false">+ 30-day level (experimental)</button>
  </div>
  <div class="chart-wrap"><canvas id="chart" aria-label="Observed and forecast water temperature"></canvas></div>
  <p class="note" id="chart-note">Shaded band: 90% range. Times in HST.</p>

  <h2>How good is this forecast?</h2>
  <p class="note" id="score-note"></p>
  <div class="chart-wrap skill"><canvas id="skill" aria-label="Forecast skill by lead time, backtest and live"></canvas></div>
  <p class="note" id="skill-note"></p>
  <details><summary>Show numbers</summary>
    <div class="table-scroll"><table id="scores"></table></div>
  </details>
  <p class="status" id="status"></p>
</main>

<script>
// ?embed: light theme to match the site, no heading, and report height to the parent page
const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) {
  document.documentElement.dataset.theme = "light";
  document.body.classList.add("embed");
  new ResizeObserver(() => parent.postMessage(
    { hiloForecastHeight: document.documentElement.scrollHeight }, "*")).observe(document.body);
}
const DATA_URL = "site/latest.json";   // relative to this page
const HST = { timeZone: "Pacific/Honolulu" };
const fmtDay = new Intl.DateTimeFormat("en-US", { ...HST, weekday: "short", month: "short", day: "numeric" });
const fmtFull = new Intl.DateTimeFormat("en-US", { ...HST, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// Break the line where readings are missing for more than one 3-hour step
const pts = rows => rows.flatMap((r, i) => {
  const x = Date.parse(r[0]), p = { x, y: r[1] };
  return i && x - Date.parse(rows[i - 1][0]) > 3 * 3600e3 ? [{ x: x - 1, y: null }, p] : [p];
});
const MODEL_NAMES = { anomaly_ar1: "Anomaly model", anomaly_slow: "+ 30-day level",
                      persistence: "Persistence", climatology: "Climatology" };
const MODEL_COLOR = { anomaly_ar1: "--series-1", anomaly_slow: "--series-3", persistence: "--text-2" };
let data, chart, skillChart, model = "anomaly_ar1";

function datasets() {
  const f = data.forecast[model] || [];
  const ds = [
    { label: "Observed", data: pts(data.observations), borderColor: css("--obs"),
      backgroundColor: css("--obs"), borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4 },
    { label: "_lo", data: f.map(r => ({ x: Date.parse(r[0]), y: r[2] })), borderWidth: 0, pointRadius: 0 },
    { label: "_hi", data: f.map(r => ({ x: Date.parse(r[0]), y: r[3] })), borderWidth: 0, pointRadius: 0,
      fill: 1, backgroundColor: css(MODEL_COLOR[model] + "-band") },
    { label: "Forecast", data: pts(f), borderColor: css(MODEL_COLOR[model]), backgroundColor: css(MODEL_COLOR[model]),
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4 },
    { label: `${climYears()} average`, data: pts(data.forecast.climatology || []), borderColor: css("--muted"),
      borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 3 },
  ];
  if (data.roms && data.roms.length)
    ds.push({ label: "ROMS", data: pts(data.roms), borderColor: css("--series-2"),
              backgroundColor: css("--series-2"), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4 });
  return ds;
}

function draw() {
  const issued = Date.parse(data.issued);
  const opts = {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "nearest", axis: "x", intersect: false },
    scales: {
      x: { type: "linear", grid: { color: css("--grid") }, border: { color: css("--border") },
           ticks: { color: css("--text-2"), stepSize: 86400000, maxRotation: 0, autoSkip: true,
                    callback: v => fmtDay.format(v) } },
      y: { grid: { color: css("--grid") }, border: { display: false },
           ticks: { color: css("--text-2"), callback: v => v.toFixed(1) + "°" },
           title: { display: true, text: "°C", color: css("--text-2") } },
    },
    plugins: {
      legend: { labels: { color: css("--text-2"), boxWidth: 14, boxHeight: 2,
                          filter: i => !i.text.startsWith("_") } },
      tooltip: { filter: i => !i.dataset.label.startsWith("_"),
                 callbacks: { title: i => fmtFull.format(i[0].parsed.x),
                              label: i => `${i.dataset.label}: ${i.parsed.y.toFixed(2)} °C` } },
    },
  };
  const issueLine = { id: "issueLine", afterDraw(c) {
    const x = c.scales.x.getPixelForValue(issued), a = c.chartArea;
    if (x < a.left || x > a.right) return;
    const g = c.ctx; g.save(); g.strokeStyle = css("--muted"); g.setLineDash([2, 3]);
    g.beginPath(); g.moveTo(x, a.top); g.lineTo(x, a.bottom); g.stroke();
    g.fillStyle = css("--text-2"); g.font = "11px 'IBM Plex Mono', monospace";
    g.fillText("issued", x + 4, a.top + 12); g.restore(); } };
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), { type: "line", data: { datasets: datasets() },
                                                        options: opts, plugins: [issueLine] });
}

// Climatology label from the years the live model was fit on, e.g. "2010–2026 average"
const climYears = () => `${data.model.data_start.slice(0, 4)}–${data.model.data_end.slice(0, 4)}`;
const pct = v => (v == null || !isFinite(v)) ? "–" : `${Math.round(v * 100)}%`;

function summary() {
  const el = document.getElementById("summary"), info = data.issue_info;
  const f = data.forecast[model], c = data.forecast.climatology;
  if (!info || !f || !c) { el.textContent = ""; return; }
  const t = new Date(data.issued);
  const day = +new Intl.DateTimeFormat("en-US", { ...HST, day: "numeric" }).format(t);
  const month = new Intl.DateTimeFormat("en-US", { ...HST, month: "long" }).format(t);
  const when = `${day <= 10 ? "early" : day <= 20 ? "mid" : "late"} ${month}`;
  const a0 = info.anom_start, L = info.slow_level, NEAR = 0.15;
  const dir = a => a < 0 ? "cooler" : "warmer";
  const s = [];
  s.push(Math.abs(a0) < NEAR
    ? `At 2 PM the water was ${info.start.toFixed(1)} °C, close to the ${climYears()} average for ${when}.`
    : `At 2 PM the water was ${info.start.toFixed(1)} °C, ${Math.abs(a0).toFixed(1)} °C ${dir(a0)} than the ${climYears()} average for ${when}.`);
  s.push(Math.abs(L) < 0.1 ? "Over the past month it has been close to that average."
    : `Over the past month it has run ${Math.abs(L).toFixed(1)} °C ${L < 0 ? "below" : "above"} that average.`);
  const d = f.map((r, i) => r[1] - c[i][1]);
  const name = model === "anomaly_ar1" ? "The forecast" : "The 30-day-level forecast";
  if (Math.abs(a0) < NEAR) s.push(`${name} expects it to stay near average this week.`);
  else {
    const j = d.findIndex(v => Math.abs(v) < NEAR);
    const end = d[d.length - 1];
    s.push(j >= 0
      ? `${name} expects it to stay ${dir(a0)} than average until about ${new Intl.DateTimeFormat("en-US", { ...HST, weekday: "long" }).format(new Date(f[j][0]))}, then sit near average.`
      : `${name} expects it to stay ${dir(a0)} than average all week, still about ${Math.abs(end).toFixed(1)} °C ${end < 0 ? "below" : "above"} by ${new Intl.DateTimeFormat("en-US", { ...HST, weekday: "long" }).format(new Date(f[f.length - 1][0]))}.`);
  }
  const tm = f[7];   // 24 h after issue: 2 PM tomorrow
  if (tm) s.push(`For 2 PM tomorrow it gives a 90% range of ${tm[2].toFixed(1)} to ${tm[3].toFixed(1)} °C.`);
  el.textContent = s.join(" ");
}

function liveSkill(m) {
  const L = data.live || {}, a = L[m], c = L.climatology;
  if (!a || !c) return [];
  return a.crps.map((v, i) => (v == null || c.crps[i] == null) ? null : 1 - v / c.crps[i]);
}

function drawSkill() {
  const B = data.benchmark;
  const models = ["anomaly_ar1", "anomaly_slow", "persistence"];
  const leadsH = B ? B.leads_h : Array.from({ length: 56 }, (_, i) => (i + 1) * 3);
  const xy = (arr) => arr.map((v, i) => ({ x: leadsH[i] / 24, y: v == null ? null : v * 100 }));
  const ds = [];
  if (B) {
    const a = B.models.anomaly_ar1;
    ds.push({ label: "_lo", data: xy(a.lo), borderWidth: 0, pointRadius: 0 });
    ds.push({ label: "_hi", data: xy(a.hi), borderWidth: 0, pointRadius: 0, fill: 0,
              backgroundColor: css("--series-1-band") });
    for (const m of models)
      ds.push({ label: MODEL_NAMES[m], data: xy(B.models[m].skill),
                borderColor: m === "persistence" ? css("--muted") : css(MODEL_COLOR[m]),
                backgroundColor: m === "persistence" ? css("--muted") : css(MODEL_COLOR[m]),
                borderWidth: m === "persistence" ? 1 : 2, pointRadius: 0, pointHoverRadius: 4,
                _n: B.n_forecasts, _kind: "backtest" });
  }
  for (const m of ["anomaly_ar1", "anomaly_slow"]) {   // live dots for our models only
    const n = (data.live[m] || {}).n || [];
    ds.push({ label: "_live " + MODEL_NAMES[m], data: xy(liveSkill(m)), showLine: false,
              borderColor: css("--surface"), backgroundColor: css(MODEL_COLOR[m]), borderWidth: 1.5,
              pointRadius: 4, pointHoverRadius: 6, _n: n, _kind: "live", _name: MODEL_NAMES[m] });
  }
  const zero = { id: "zero", beforeDatasetsDraw(c) {
    const y = c.scales.y.getPixelForValue(0), a = c.chartArea, g = c.ctx;
    g.save(); g.strokeStyle = css("--muted"); g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(a.left, y); g.lineTo(a.right, y); g.stroke();
    g.fillStyle = css("--text-2"); g.font = "11px 'IBM Plex Mono', monospace";
    g.fillText(`${climYears()} average`, a.left + 6, y - 5); g.restore(); } };
  if (skillChart) skillChart.destroy();
  skillChart = new Chart(document.getElementById("skill"), {
    type: "line", data: { datasets: ds }, plugins: [zero],
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      scales: {
        x: { type: "linear", min: 0, max: 7, grid: { color: css("--grid") }, border: { color: css("--border") },
             ticks: { color: css("--text-2"), stepSize: 1, callback: v => v ? `${v} d` : "" },
             title: { display: true, text: "How far ahead", color: css("--text-2") } },
        y: { min: -40, max: 80, grid: { color: css("--grid") }, border: { display: false },
             ticks: { color: css("--text-2"), stepSize: 20, callback: v => v + "%" } },
      },
      plugins: {
        legend: { labels: { color: css("--text-2"), boxWidth: 14, boxHeight: 2,
                            filter: i => !i.text.startsWith("_") } },
        tooltip: {
          filter: i => !i.dataset.label.startsWith("_lo") && !i.dataset.label.startsWith("_hi") && i.parsed.y != null,
          callbacks: {
            title: i => { const h = Math.round(i[0].parsed.x * 24); return h < 24 ? `${h} h ahead` : `${(h / 24).toFixed(h % 24 ? 1 : 0)} days ahead`; },
            label: i => i.dataset._kind === "live"
              ? `${i.dataset._name}, live: ${Math.round(i.parsed.y)}% (${i.dataset._n[i.dataIndex]} checked)`
              : `${i.dataset.label}, backtest: ${Math.round(i.parsed.y)}%`,
          } },
      },
    },
  });
}

function scoresTable() {
  const B = data.benchmark, idx = [0, 7, 23, 55], lab = ["3 h", "1 day", "3 days", "7 days"];
  const models = ["anomaly_ar1", "anomaly_slow", "persistence"];
  let html = "<thead><tr><th>Skill vs climatology</th>" + lab.map(l => `<th>${l}</th>`).join("") + "</tr></thead><tbody>";
  for (const m of models) {
    if (B) html += `<tr><td>${MODEL_NAMES[m]}, backtest</td>` + idx.map(i =>
      `<td>${pct(B.models[m].skill[i])} <span style="color:var(--muted)">(${pct(B.models[m].lo[i])} to ${pct(B.models[m].hi[i])})</span></td>`).join("") + "</tr>";
    const lv = liveSkill(m), n = (data.live[m] || {}).n || [];
    html += `<tr><td>${MODEL_NAMES[m]}, live</td>` + idx.map(i =>
      `<td>${pct(lv[i])} <span style="color:var(--muted)">n=${n[i] || 0}</span></td>`).join("") + "</tr>";
  }
  document.getElementById("scores").innerHTML = html + "</tbody>";
}

function scoreNote() {
  const B = data.benchmark, L = (data.live || {}).anomaly_ar1;
  const n3 = L ? L.n[0] : 0, n7 = L ? L.n[55] : 0;
  const parts = [];
  if (B) parts.push(`Backtest: ${B.n_forecasts.toLocaleString()} past forecasts, ${B.years}, each made using only data from before its issue time.`);
  if (!n3) parts.push("Live: no forecast has been checked yet.");
  else parts.push(`Live, last ${data.score_window_days} days: ${n3} forecasts checked at 3 h, ${n7} at 7 days.`);
  if (data.first_issued && n7 === 0) {
    const first7 = new Date(Date.parse(data.first_issued) + 7 * 86400e3);
    parts.push(`The first 7-day check is ${new Intl.DateTimeFormat("en-US", { ...HST, month: "short", day: "numeric" }).format(first7)}.`);
  }
  if (n7 && n7 < 30) parts.push("With this few, live dots will scatter; what matters is whether they fall around the backtest line.");
  document.getElementById("score-note").textContent = parts.join(" ");
  document.getElementById("skill-note").textContent =
    `Skill: how much smaller the typical miss is than forecasting the ${climYears()} average for each date and hour (climatology); 0% means no better. ` +
    (B ? `Lines: backtest (${B.years}), where each year is compared with the average of the other years so it never sees itself; the blue band is its 95% range across years. ` : "") +
    "Dots: live forecasts. Persistence (gray) zigzags because it ignores the daily cycle.";
}

fetch(DATA_URL, { cache: "no-store" }).then(r => r.json()).then(d => {
  data = d;
  document.getElementById("meta").textContent = data.issued
    ? `Issued ${fmtFull.format(Date.parse(data.issued))} HST · last buoy reading ${fmtFull.format(Date.parse(data.last_observation))} HST`
    : "No forecast issued yet.";
  document.getElementById("status").textContent =
    `Updated ${fmtFull.format(Date.parse(data.generated))} HST · ${data.status.join(" · ")} · ` +
    `model fit on ${data.model.data_start.slice(0, 10)} to ${data.model.data_end.slice(0, 10)}`;
  document.getElementById("chart-note").textContent =
    `Shaded band: 90% range. Dashed line: ${climYears()} average for each date and hour (climatology), smoothed over ±15 days. Times in HST.`;
  draw(); summary(); drawSkill(); scoresTable(); scoreNote();
}).catch(() => {
  document.querySelector(".chart-wrap").innerHTML = '<p class="err">Forecast data could not be loaded.</p>';
  document.getElementById("meta").textContent = "";
});

document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  model = b.dataset.model;
  document.querySelectorAll(".toggle button").forEach(x => x.setAttribute("aria-pressed", x === b));
  draw(); summary();
}));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (data) { draw(); drawSkill(); } });
</script>
</body>
</html>
