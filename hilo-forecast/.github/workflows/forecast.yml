name: Hilo Bay forecast

on:
  schedule:
    - cron: "15 2 * * *"      # 02:15 UTC = 4:15 PM HST, after the 00 UTC issue time
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: hilo-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt
      - run: pip install -r forecast/requirements.txt
      - name: Issue, archive and score
        run: python forecast/daily.py
      - name: Commit results
        run: |
          git config user.name "hilo-forecast-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast/archive forecast/site
          git diff --cached --quiet || git commit -m "Forecast $(date -u +%Y-%m-%d)"
          git push
